name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Run retained tests
        # The retained suite creates rootful Podman containers, enters their
        # network namespaces to install nftables rules, and cleans up files
        # written through root-owned bind mounts. Run the whole test process as
        # root so namespace enforcement and cleanup use one consistent owner.
        run: sudo env "PATH=$PATH" AGENTEVAL_PODMAN=1 AGENTEVAL_PODMAN_SUDO=0 npm test

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
