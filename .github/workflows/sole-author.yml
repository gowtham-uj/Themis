name: Sole author check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  sole-author:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify commit authorship
        shell: bash
        env:
          EXPECTED_AUTHOR_EMAIL: 108682700+gowtham-uj@users.noreply.github.com
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            range="$CURRENT_SHA"
          else
            range="$BEFORE_SHA..$CURRENT_SHA"
          fi

          failed=0

          while read -r sha; do
            [[ -n "$sha" ]] || continue

            author_email="$(git show -s --format='%ae' "$sha")"
            if [[ "$author_email" != "$EXPECTED_AUTHOR_EMAIL" ]]; then
              echo "::error title=Unexpected commit author::$sha uses $author_email"
              failed=1
            fi

            message="$(git show -s --format='%B' "$sha")"

            if printf '%s\n' "$message" | git interpret-trailers --parse | grep -Eiq '^Co-Authored-By:'; then
              echo "::error title=Co-author trailer found::$sha contains Co-Authored-By"
              failed=1
            fi

            footer="$(printf '%s\n' "$message" | awk '
              { lines[NR] = $0 }
              END {
                end = NR
                while (end > 0 && lines[end] ~ /^[[:space:]]*$/) end--
                start = end
                while (start > 0 && lines[start] !~ /^[[:space:]]*$/) start--
                for (i = start + 1; i <= end; i++) print lines[i]
              }
            ')"

            if printf '%s\n' "$footer" | grep -Eiq '^(🤖[[:space:]]*)?Generated[[:space:]]+(with|by)[[:space:]].*(Claude|Codex|ChatGPT|OpenAI|Gemini|Copilot|Cursor|Windsurf|Devin|Replit|AI)|^Claude-Session:'; then
              echo "::error title=AI attribution found::$sha contains assistant attribution"
              failed=1
            fi
          done < <(git rev-list "$range")

          exit "$failed"
